<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>Flappy Bird (recreation)</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="288" height="512" aria-label="Flappy Bird game">
      This game needs a browser with canvas support.
    </canvas>
    <script src="js/config.js"></script>
    <script src="js/rng.js"></script>
    <script src="js/bird.js"></script>
    <script src="js/pipes.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/game.js"></script>
    <script src="js/loop.js"></script>
    <script src="js/pixels.js"></script>
    <script src="js/font.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/render.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
